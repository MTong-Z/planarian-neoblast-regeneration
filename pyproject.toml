[project]
name = "planarian-neoblast-regeneration"
version = "0.1.0"
description = "A STAT 530 course project on temporal neoblast composition and spatial tissue context during planarian regeneration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Miantong Zhang"}]
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "matplotlib>=3.9,<4",
    "h5py>=3.11,<4",
    "anndata>=0.11,<0.13",
    "scanpy==1.11.5",
    "nbformat>=5.10,<6",
    "nbconvert>=7.16,<8",
    "nbclient>=0.10,<1",
    "ipykernel>=6.29,<8",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.3,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neoblast_analysis"]
